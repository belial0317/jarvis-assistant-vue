name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 不指定 version：以 package.json packageManager 字段为准（pnpm@11.x）；
        # 显式 version:9 会与 packageManager 冲突报 "Multiple versions of pnpm specified"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  gitleaks:
    runs-on: ubuntu-latest
    # gitleaks-action 在 PR 事件下 ScanPullRequest 需 pull-requests 权限，
    # SARIF 上报需 security-events：GITHUB_TOKEN 默认只读会报
    # "Resource not accessible by integration"
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
